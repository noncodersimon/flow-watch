name: Fetch market data

on:
  schedule:
    - cron: "30 6 * * 1-6"   # 06:30 UTC Mon-Sat (Sat catches Friday US close + weekly COT)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run adapters
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        working-directory: adapters
        run: |
          python volume_alphavantage.py
          python cot_cftc.py
          python etf_flows.py
          python informed_money.py

      - name: Commit updated data
        run: |
          git config user.name "market-flows-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
