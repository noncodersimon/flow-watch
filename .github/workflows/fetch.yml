name: Fetch market data

on:
  schedule:
    # 22:00 UTC Mon-Fri, which is after both closes whatever the season -
    # the LSE at 15:30 UTC and New York at 20:00 UTC in summer, an hour
    # later each in winter. The run takes about three hours, so the day's
    # own closes land overnight and a UK morning opens on yesterday's
    # session rather than the one before it. A morning run could only ever
    # carry the previous day. Friday evening also catches the weekly COT,
    # published 15:30 New York time, so no Saturday run is needed.
    # Not on the hour: GitHub queues scheduled runs behind everyone else's,
    # and the first 22:00 run was held five hours (started 03:01, ran its
    # usual 2h36, committed 05:37 - it still made the morning, but with far
    # less margin than intended). An odd minute away from the top of the
    # hour is GitHub's own advice for that.
    - cron: "41 21 * * 1-5"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Run adapters
        env:
          # SEC fair-access wants a contact address it can reach. Set this as
          # a repository variable; without it the adapter falls back to a
          # placeholder, which works but is not what the policy asks for.
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        working-directory: adapters
        run: |
          python price_volume_yahoo.py
          python cot_cftc.py
          python etf_flows.py
          python informed_money.py
          python sec_form4.py
          python build_summary.py

      - name: Commit updated data
        run: |
          git config user.name "market-flows-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          # The run takes hours and code lands on main meanwhile. A bare push
          # from the checkout-time commit is then rejected and the whole
          # fetch dies with the runner - so rebase the data commit onto
          # whatever main has become, and retry around the race window.
          # Only this workflow touches /data, so the rebase cannot conflict.
          pushed=""
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying" >&2
            sleep 10
          done
          [ -n "$pushed" ]
